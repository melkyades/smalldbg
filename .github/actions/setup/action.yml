name: setup
description: Installs Conan and Ninja, and restores the Conan packages built before.
inputs:
  cache-key:
    description: What tells this platform's packages apart from another's
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: |
        pip install conan ninja
        conan profile detect --force
    - uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ inputs.cache-key }}-${{ hashFiles('conanfile.txt') }}
